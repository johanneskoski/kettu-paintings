<!doctype html>
<html lang="fi">
<head><meta charset="utf-8"><title>Penkki, jolle kukaan ei halua istua</title></head>
<body style="margin:0;background:#000">
<canvas id="c" width="2400" height="1350"></canvas>
<script>
// Kettu (Claude), 15 Nov 2026. In the manner of a hand drawing, in JavaScript: pastels, colored pencils and
// white gouache on dark blue paper. The 3D underdrawing (kansi.py, opas.py) gives the strokes their direction
// and color; every stroke is drawn separately, and nothing is copied from the underdrawing as such.
const W = 2400, H = 1350;
const P = Object.fromEntries(new URLSearchParams(location.search));
const SIEMEN = +(P.siemen || 1115);

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(SIEMEN);
const sat = (a, b) => a + (b - a) * rnd();
const gauss = () => { let u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

async function kuva(src) { const i = new Image(); i.src = src; await i.decode(); const c = new OffscreenCanvas(W, H); const x = c.getContext('2d'); x.drawImage(i, 0, 0); return x.getImageData(0, 0, W, H).data; }

// ---------------------------------------------------------------- pastel sticks (a limited palette, as in a real box)
const LIIDUT = {
  yo: ['#10142a', '#171e38', '#1f2a4a', '#283763', '#33457a', '#3d4f86', '#4a5d9a', '#5b4a7a', '#433a66', '#2d5a6e', '#24435a', '#6b7fb0'],
  hamy: ['#8f9cc4', '#a4acd0', '#b7b9cf', '#c9a9b4', '#a88fae', '#d6b8a0', '#7f90b8'],
  valo: ['#f2d7b0', '#f6e3c3', '#fbefd6', '#ffe4a8', '#f5c49a', '#fff6e6', '#f0c8a8', '#ffd9a0', '#e9b48f'],
  puu: ['#3e2620', '#5a3424', '#6a3f2a', '#8a5636', '#a8714a', '#c08a5e'],
  metalli: ['#0d1020', '#151a2e', '#232a40', '#2e3756', '#3a4466'],
  korostus: ['#e98a6b', '#7fc4c0', '#f4a582', '#9fd3c7'],
};
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const KAIKKI = Object.values(LIIDUT).flat().map(hex);
function lahimmat(r, g, b, ryhma) {
  const lista = ryhma ? LIIDUT[ryhma].map(hex) : KAIKKI;
  return lista.map(c => [c, (c[0] - r) ** 2 * 0.3 + (c[1] - g) ** 2 * 0.59 + (c[2] - b) ** 2 * 0.11]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
}
const ALUEEN_LIIDUT = { 0: ['yo', 'hamy'], 1: ['yo', 'hamy', 'valo'], 6: ['yo', 'hamy', 'valo'], 2: ['puu', 'yo'], 3: ['metalli', 'yo'], 4: ['yo', 'hamy', 'valo'], 5: ['hamy', 'valo'] };
const LAATIKOT = {};
for (const [a, ryhmat] of Object.entries(ALUEEN_LIIDUT)) LAATIKOT[a] = ryhmat.flatMap(g => LIIDUT[g]).map(hex);
function liitu(r, g, b, vaihtelu = 0.3, alue = null) {   // the nearest stick, sometimes the second nearest: broken color
  const lista = alue === null ? KAIKKI : LAATIKOT[alue];
  const l = lista.map(c => [c, (c[0] - r) ** 2 * 0.3 + (c[1] - g) ** 2 * 0.59 + (c[2] - b) ** 2 * 0.11]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
  const k = rnd() < vaihtelu ? l[1 + Math.floor(rnd() * 2)] : l[0];
  return k;
}
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;

// ---------------------------------------------------------------- the paper and its tooth (`nyppy`)
function arvokohina(leveys, korkeus, solu, siemen) {
  const r = mulberry32(siemen), gw = Math.ceil(leveys / solu) + 2, gh = Math.ceil(korkeus / solu) + 2;
  const g = new Float32Array(gw * gh).map(() => r());
  const out = new Float32Array(leveys * korkeus);
  for (let y = 0; y < korkeus; y++) { const fy = y / solu, j = fy | 0; let ty = fy - j; ty = ty * ty * (3 - 2 * ty);
    for (let x = 0; x < leveys; x++) { const fx = x / solu, i = fx | 0; let tx = fx - i; tx = tx * tx * (3 - 2 * tx);
      const a = g[j * gw + i] * (1 - tx) + g[j * gw + i + 1] * tx, b = g[(j + 1) * gw + i] * (1 - tx) + g[(j + 1) * gw + i + 1] * tx;
      out[y * leveys + x] = a * (1 - ty) + b * ty; } }
  return out;
}
let NYPPY;                                           // height of the paper surface 0..1: pigment catches on the peaks
function teePaperi(ctx) {
  const k1 = arvokohina(W, H, 1.7, 11), k2 = arvokohina(W, H, 4.5, 12), k3 = arvokohina(W, H, 60, 13);
  NYPPY = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) NYPPY[i] = Math.min(1, Math.max(0, (0.45 * k1[i] + 0.40 * k2[i] + 0.15 * k3[i] - 0.5) * 1.15 + 0.5));
  const img = ctx.createImageData(W, H), d = img.data;
  const pohja = hex(P.paperi || '#283152');
  for (let i = 0; i < W * H; i++) {
    const v = (NYPPY[i] - 0.5) * 10 + (k3[i] - 0.5) * 8;
    d[4 * i] = pohja[0] + v; d[4 * i + 1] = pohja[1] + v; d[4 * i + 2] = pohja[2] + v * 1.2; d[4 * i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  for (let n = 0; n < 2600; n++) {                   // paper fibers
    const x = rnd() * W, y = rnd() * H, a = rnd() * Math.PI, l = sat(6, 22);
    ctx.strokeStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a) * l / 2 + gauss() * 2, y + Math.sin(a) * l / 2 + gauss() * 2, x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
  }
}
// a layer is drawn separately and masked with the paper's tooth: the lighter the pressure, the more paper shows
function kerros() { const c = new OffscreenCanvas(W, H); const x = c.getContext('2d'); x.lineCap = 'round'; x.lineJoin = 'round'; return [c, x]; }
function painaKerros(ctx, [c, x], paine, pehmeys = 0.2, valoPaine = 0.3) {
  const img = x.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < W * H; i++) {
    const a = d[4 * i + 3]; if (!a) continue;
    // a thicker layer fills more of the pits in the tooth, and when drawing light the stick is pressed harder
    const p = paine * (0.55 + 0.45 * a / 255) + valoPaine * DATA[4 * i + 1] / 255;
    const raja = 1 - p, t = Math.min(1, Math.max(0, (NYPPY[i] - raja + pehmeys) / (2 * pehmeys)));
    d[4 * i + 3] = a * t;
  }
  x.putImageData(img, 0, 0);
  ctx.drawImage(c, 0, 0);
}

// ---------------------------------------------------------------- underdrawing
let VARI, DATA, TARK, MUOTO, TIEDOT;
function nayte(x, y) {
  x = Math.max(0, Math.min(W - 1, x | 0)); y = Math.max(0, Math.min(H - 1, y | 0)); const i = 4 * (y * W + x);
  const m0 = (MUOTO[i] - 128) / 300 * 1.6, m = Math.max(-0.36, Math.min(0.08, m0)), k = 1 + m;   // form light in the hollow: the shadow must not darken into an object
  return { r: Math.min(255, VARI[i] * k), g: Math.min(255, VARI[i + 1] * k), b: Math.min(255, VARI[i + 2] * (1 + m * 0.6)), alue: Math.round(DATA[i] / 40), valo: DATA[i + 1] / 255, kulma: DATA[i + 2] / 255 * Math.PI, tark: TARK[i] / 255, muoto: m0 };
}
// streamline: follows the stroke direction, turns smoothly and does not cross a region boundary (clean silhouettes)
const ryhma = a => a === 5 ? 4 : a === 6 ? 1 : a;      // the hollow belongs to the seat snow and the prints to the ground: their edges do not cut a stroke
function viiva(x, y, pituus, askel = 3, sallitut = null) {
  const s0 = nayte(x, y), alue = ryhma(s0.alue), pts = [[x, y]];
  const vire = gauss() * (alue >= 2 && alue <= 4 ? 0.12 : 0.07);
  let dx = Math.cos(s0.kulma + vire), dy = Math.sin(s0.kulma + vire);
  if (rnd() < 0.5) { dx = -dx; dy = -dy; }
  for (let k = 0; k < pituus / askel; k++) {
    const s = nayte(x, y);
    let nx = Math.cos(s.kulma + vire), ny = Math.sin(s.kulma + vire);
    if (nx * dx + ny * dy < 0) { nx = -nx; ny = -ny; }
    dx = 0.7 * dx + 0.3 * nx; dy = 0.7 * dy + 0.3 * ny; const n = Math.hypot(dx, dy); dx /= n; dy /= n;
    x += dx * askel; y += dy * askel;
    if (x < -5 || y < -5 || x > W + 5 || y > H + 5) break;
    const a2 = ryhma(nayte(x, y).alue);
    if (sallitut ? !sallitut.includes(a2) : a2 !== alue) break;
    pts.push([x, y]);
  }
  return pts;
}
function keskiNayte(x, y, s) {                       // wood and metal: color averaged along the stroke direction, so that the edge of a shadow is not left as a hard seam
  if (s.alue !== 2 && s.alue !== 3) return s;
  let r = 0, g = 0, b = 0, n = 0; const dx = Math.cos(s.kulma), dy = Math.sin(s.kulma);
  for (let k = -3; k <= 3; k++) { const t = nayte(x + dx * k * 16, y + dy * k * 16); if (t.alue !== s.alue) continue; r += t.r; g += t.g; b += t.b; n++; }
  return Object.assign({}, s, { r: r / n, g: g / n, b: b / n });
}
function polku(ctx, pts, jitter = 0) {
  ctx.beginPath(); ctx.moveTo(pts[0][0] + gauss() * jitter, pts[0][1] + gauss() * jitter);
  for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
}
// pastel stroke: several bristles (`karvoja`) side by side, each with its own pressure
function pastelli(ctx, pts, leveys, vari, alfa, karvoja = 4) {
  if (pts.length < 2) return;
  let pituus = 0; for (let i = 1; i < pts.length; i++) pituus += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  if (pituus < leveys * 1.5) return;                 // a short wide stroke would be a slab with rounded corners
  for (let k = 0; k < karvoja; k++) {
    const siirto = (k / (karvoja - 1 || 1) - 0.5) * leveys * 0.8 + gauss() * leveys * 0.08;
    const v = [vari[0] + gauss() * 5, vari[1] + gauss() * 5, vari[2] + gauss() * 5];
    ctx.strokeStyle = rgba(v, alfa * sat(0.55, 1.0)); ctx.lineWidth = leveys / karvoja * sat(1.3, 2.0);
    let q = pts.map(([x, y], i) => {
      const j = Math.min(i + 1, pts.length - 1), h = Math.max(i - 1, 0);
      let tx = pts[j][0] - pts[h][0], ty = pts[j][1] - pts[h][1]; const n = Math.hypot(tx, ty) || 1;
      return [x - ty / n * siirto, y + tx / n * siirto];
    });
    // the bristles differ in length: the ends of the stroke are left frayed, as with a real stick
    const alkuun = Math.floor(rnd() * rnd() * q.length * 0.35), loppuun = Math.floor(rnd() * rnd() * q.length * 0.35);
    q = q.slice(alkuun, Math.max(alkuun + 2, q.length - loppuun));
    if (q.length < 2) continue;
    polku(ctx, q, 0.4); ctx.stroke();
  }
}
function kyna(ctx, pts, leveys, vari, alfa) {
  if (pts.length < 2) return;
  ctx.strokeStyle = rgba(vari, alfa); ctx.lineWidth = leveys; polku(ctx, pts, 0.3); ctx.stroke();
}

// ---------------------------------------------------------------- drawing
async function piirra() {
  [VARI, DATA, TARK, MUOTO] = await Promise.all([kuva('opas_vari.png'), kuva('opas_data.png'), kuva('opas_tarkeys.png'), kuva('opas_muoto.png')]);
  TIEDOT = await (await fetch('opas_tiedot.json')).json();
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  teePaperi(ctx);
  const tila = t => { document.title = t; console.log(t); };

  // 1. ground layer (`pohjustus`): wide strokes with the side of the pastel over the whole surface; the paper may show
  { const K = kerros(), x = K[1];
    for (let n = 0; n < +(P.n1 || 9000); n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      const lev = sat(24, 46) * (1 - 0.45 * s.tark), pit = sat(60, 170) * (1 - 0.4 * s.tark);
      const pts = viiva(sx, sy, pit, 4);
      const tumma = 0.82 + 0.18 * s.valo;
      const v = liitu(s.r * tumma, s.g * tumma, s.b * tumma, 0.4, s.alue);
      pastelli(x, pts, lev, v, sat(0.35, 0.6), 5);
    }
    painaKerros(ctx, K, 0.62, 0.2, 0.6); tila('pohjustus'); }

  // 2. body (`runko`): medium-sized strokes, denser in important and lit places
  { const K = kerros(), x = K[1];
    for (let n = 0; n < +(P.n2 || 48000); n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (rnd() > 0.25 + 0.75 * Math.max(s.tark, s.valo * 0.8)) continue;
      const lev = sat(8, 19) * (1 - 0.55 * s.tark), pit = sat(26, 90) * (1 - 0.45 * s.tark);
      const pts = viiva(sx, sy, pit, 3);
      pastelli(x, pts, lev, liitu(s.r, s.g, s.b, 0.3, s.alue), sat(0.45, 0.8), 4);
    }
    painaKerros(ctx, K, 0.8); tila('runko'); }

  // 2b. smudging (`hieronta`): in dark places, wide translucent strokes, as if the pastel had been rubbed with a finger
  { const K = kerros(), x = K[1];
    for (let n = 0; n < 2600; n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.valo > 0.3 || s.alue >= 2 && s.alue <= 5) continue;
      const pts = viiva(sx, sy, sat(80, 200), 5);
      pastelli(x, pts, sat(45, 90), [s.r, s.g, s.b * 1.03], sat(0.10, 0.18), 3);
    }
    ctx.filter = 'blur(9px)'; ctx.drawImage(K[0], 0, 0); ctx.filter = 'none'; }   // smudged pastel: no edges

  // 3. colored-pencil hatching in the shadows: dark blue-violets, cross-hatched in the deepest ones
  { const K = kerros(), x = K[1];
    for (let n = 0; n < +(P.n3 || 15000); n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      const lum = (0.3 * s.r + 0.59 * s.g + 0.11 * s.b) / 255;
      if (lum > 0.42 || rnd() > 0.9 - lum) continue;
      const laikku = Math.sin(sx * 0.004 + 1.3) * Math.cos(sy * 0.005 - 0.7);
      const kulma = (s.alue === 1 || s.alue === 6) ? 0.55 + 0.35 * laikku + gauss() * 0.05 : s.kulma + 0.6;
      const pit = sat(10, 30), pts = [];
      for (let k = 0; k <= pit / 4; k++) pts.push([sx + Math.cos(kulma) * k * 4 + gauss() * 0.3, sy + Math.sin(kulma) * k * 4 + gauss() * 0.3]);
      const lahi = lahimmat(s.r, s.g, s.b, 'yo'), v = lahi[Math.floor(rnd() * 3)];
      kyna(x, pts, sat(1.2, 2.1), v, sat(0.3, 0.55));
      if (lum < 0.16 && rnd() < 0.5) {                // cross-hatching
        const k2 = kulma + 1.2, q = pts.map((_, k) => [sx + Math.cos(k2) * k * 4, sy + Math.sin(k2) * k * 4]);
        kyna(x, q, sat(1.0, 1.8), hex(LIIDUT.yo[Math.floor(rnd() * 5)]), sat(0.25, 0.5));
      }
    }
    painaKerros(ctx, K, 0.8, 0.1); tila('viivoitus'); }

  // 4. details: the bench more precisely, outlines, the hollow and the prints
  { const K = kerros(), x = K[1];
    for (let n = 0; n < +(P.n4 || 60000); n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.tark < 0.55 || rnd() > s.tark ** 2) continue;
      const pit = sat(10, 34), lev = sat(3, 7.5);
      const pts = viiva(sx, sy, pit, 2);
      pastelli(x, pts, lev, liitu(s.r, s.g, s.b, 0.2, s.alue), sat(0.55, 0.9), 3);
    }
    // outlines: sketch-like, lightly side by side
    for (const [ex, ey, a, sil] of TIEDOT.reunat) {
      if (rnd() > (sil ? 0.75 : 0.35)) continue;
      const l = sat(8, 20), o = gauss() * 0.8, dx = Math.cos(a), dy = Math.sin(a);
      const pts = [[ex - dx * l / 2 - dy * o, ey - dy * l / 2 + dx * o], [ex + dx * l / 2 - dy * o, ey + dy * l / 2 + dx * o]];
      kyna(x, pts, sat(1.1, 2.0), hex(sil ? '#0d1020' : '#1f2a4a'), sat(0.3, 0.6));
    }
    painaKerros(ctx, K, 0.85, 0.1); tila('yksityiskohdat'); }

  // 5. hollow: short strokes in the tones of its bottom, a crescent of shadow on the front wall, a crescent of light on the back wall and a warm glint
  { const K = kerros(), x = K[1];
    const [kx, ky] = TIEDOT.kuopan_keski, [rx, ry] = TIEDOT.kuopan_sateet;
    for (let n = 0; n < 900; n++) {
      const t = rnd() * 2 * Math.PI, rr = Math.sqrt(rnd()) * 1.08;
      const px = kx + Math.cos(t) * rx * rr, py = ky + Math.sin(t) * ry * rr, s = nayte(px, py);
      const a = TIEDOT.rima_kulma + gauss() * 0.25, l = sat(6, 16);
      const pts = [[px - Math.cos(a) * l / 2, py - Math.sin(a) * l / 2], [px, py + gauss() * 0.6], [px + Math.cos(a) * l / 2, py + Math.sin(a) * l / 2]];
      pastelli(x, pts, sat(3, 6), liitu(s.r, s.g, s.b, 0.15, 5), sat(0.45, 0.8), 3);
    }
    // contour lines: colored-pencil lines parallel to the bench dip at the hollow; they show only where there is depth
    for (const viivaP of TIEDOT.poikkiviivat) {
      for (let kerta = 0; kerta < 2; kerta++) {
        const siirto = gauss() * 0.7;
        for (let i = 1; i < viivaP.length; i++) {
          const [x0, y0, d0] = viivaP[i - 1], [x1, y1, d1] = viivaP[i];
          const d = (d0 + d1) / 2; if (d < 0.04) continue;
          const s = nayte(x1, y1), lum = (0.3 * s.r + 0.59 * s.g + 0.11 * s.b) / 255;
          const vari = hex(lum < 0.5 ? (rnd() < 0.5 ? '#7f90b8' : '#a88fae') : (rnd() < 0.5 ? '#b7b9cf' : '#c9a9b4'));
          if (rnd() < 0.12) continue;                                      // broken line
          const varjoon = Math.max(0, -s.muoto) * 2.5;
          kyna(x, [[x0, y0 + siirto], [x1, y1 + siirto + gauss() * 0.4]], sat(1.1, 1.8), vari, Math.min(0.6, 0.06 + d * 0.25 + varjoon * 0.35) * sat(0.6, 1));
        }
      }
    }
    for (let k = 0; k < 5; k++) {                                                              // thin rim of light on the back wall
      const t0 = 3.55 + gauss() * 0.08, t1 = 4.75 + gauss() * 0.1, rr = sat(0.8, 0.9), pts = [];
      for (let i = 0; i <= 12; i++) { const tt = t0 + (t1 - t0) * i / 12; pts.push([kx + Math.cos(tt) * rx * rr, ky + Math.sin(tt) * ry * rr]); }
      kyna(x, pts, sat(1.4, 2.4), hex(rnd() < 0.5 ? '#fbefd6' : '#f6e3c3'), sat(0.18, 0.32));
    }
    for (let k = 0; k < 0; k++) {                                                              // glint left out
      const px = kx + gauss() * rx * 0.12, py = ky - ry * 0.28 + gauss() * ry * 0.08, a = TIEDOT.rima_kulma;
      pastelli(x, [[px - 9 * Math.cos(a), py - 9 * Math.sin(a)], [px + 9 * Math.cos(a), py + 9 * Math.sin(a)]], sat(3, 5), hex(rnd() < 0.6 ? '#fff6e6' : '#ffe4a8'), sat(0.3, 0.55), 2);
    }
    painaKerros(ctx, K, 0.9, 0.12); tila('kuoppa'); }

  // 6. paw prints: main pad and four toes in a dark tone, a rim of light in the snow
  { const K = kerros(), x = K[1];
    for (const j of TIEDOT.jaljet) {
      if (j.x < -60 || j.y < -60 || j.x > W + 60 || j.y > H + 60) continue;
      const fx = (j.ex - j.x) / 0.05, fy = (j.ey - j.y) / 0.05;           // pixels per meter, forward
      const mitta = Math.hypot(fx, fy), ux = fx / mitta, uy = fy / mitta, vx = -uy, vy = ux;
      const m = mitta * 1.55;                                                // same size as in kansi.py
      const piste = (u, v) => [j.x + (ux * u + vx * v) * m, j.y + (uy * u + vy * v) * m * 0.62];
      const s = nayte(j.x, j.y);
      const varjo = hex(s.valo > 0.3 ? (rnd() < 0.5 ? '#5b4a7a' : '#4a5d9a') : '#283763'), varjo2 = hex('#7f90b8');
      const osat = [[-0.012, 0, 0.012, 0.85], [0.010, -0.015, 0.0065, 0.8], [0.010, 0.015, 0.0065, 0.8], [0.024, -0.006, 0.0065, 0.8], [0.024, 0.006, 0.0065, 0.8]];
      for (const [u, v, rr, a] of osat) {
        const [cx, cy] = piste(u, v), r = rr * m;
        for (let k = 0; k < 5; k++) { x.fillStyle = rgba(k < 3 ? varjo : varjo2, a * (k < 3 ? 0.38 : 0.2)); x.beginPath(); x.ellipse(cx + gauss() * r * 0.25, cy + gauss() * r * 0.18, r * sat(0.6, 1.15), r * 0.62 * sat(0.6, 1.15), Math.atan2(uy, ux) + gauss() * 0.3, 0, 2 * Math.PI); x.fill(); }
      }
      const [ax, ay] = piste(-0.06, 0), [bx, by] = piste(-0.025, 0);            // drag mark
      kyna(x, [[ax, ay], [bx, by]], 3.5, varjo2, 0.10);
      const [cx, cy] = piste(0.006, 0), valoreuna = hex('#fbefd6');
      x.strokeStyle = rgba(valoreuna, 0.5 * Math.min(1, s.valo * 1.6)); x.lineWidth = 1.6;
      x.beginPath(); x.ellipse(cx, cy, 0.036 * m, 0.036 * m * 0.62, Math.atan2(uy, ux), 0.2, 1.9); x.stroke();
    }
    painaKerros(ctx, K, 0.9, 0.08); tila('jäljet'); }

  // 7. light: glow under the lamp, sparkle in the snow and snowflakes in white gouache
  { const K = kerros(), x = K[1];
    for (let n = 0; n < 7000; n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.valo < 0.35 || rnd() > s.valo - 0.2 || s.alue === 6 || s.alue === 5) continue;
      const pts = viiva(sx, sy, sat(30, 90), 4);
      pastelli(x, pts, sat(10, 22), hex(LIIDUT.valo[Math.floor(rnd() * LIIDUT.valo.length)]), sat(0.12, 0.3), 4);
    }
    painaKerros(ctx, K, 0.5); }
  { const K = kerros(), x = K[1];                    // fill: the lit snow is pressed in more densely
    for (let n = 0; n < 9000; n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.valo < 0.4 || s.alue === 6 || s.alue === 5 || rnd() > s.valo) continue;
      const pts = viiva(sx, sy, sat(20, 60), 3);
      pastelli(x, pts, sat(6, 14), liitu(s.r, s.g, s.b, 0.25, s.alue), sat(0.35, 0.6), 4);
    }
    for (const [ex, ey, a, sil] of TIEDOT.reunat) {     // rims of light on the edges of the snow and the metal
      const s = nayte(ex, ey + 2);
      if (s.valo < 0.35 || rnd() > 0.5) continue;
      const l = sat(10, 22), dx = Math.cos(a), dy = Math.sin(a);
      kyna(x, [[ex - dx * l / 2, ey - dy * l / 2], [ex + dx * l / 2, ey + dy * l / 2]], sat(1.2, 2.2), hex('#fbefd6'), 0.35 * s.valo);
    }
    painaKerros(ctx, K, 0.92, 0.15); }
  { const K = kerros(), x = K[1];
    for (let n = 0; n < 900; n++) {                  // sparkle
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.valo < 0.45 || rnd() > s.valo) continue;
      x.fillStyle = rgba(hex(rnd() < 0.7 ? '#fff6e6' : '#ffe4a8'), sat(0.5, 0.95)); x.beginPath(); x.arc(sx, sy, sat(0.8, 1.9), 0, 2 * Math.PI); x.fill();
    }
    for (let n = 0; n < +(P.hiutaleet || 260); n++) { // flakes: different sizes, soft edges, some stretched by motion
      const sx = rnd() * W, sy = rnd() * H, s = nayte(sx, sy);
      const r = Math.exp(sat(Math.log(1.0), Math.log(6.5))), venyma = rnd() < 0.3 ? sat(1.4, 2.6) : 1;
      const kirkas = Math.min(1, (0.45 + 0.9 * s.valo) * sat(0.5, 1));
      for (let k = 0; k < 5; k++) {
        const kk = k / 4, rr = r * (1.6 - kk);           // the outer one wide and faint, the inner one small and bright
        x.fillStyle = rgba(hex(k < 4 ? '#e8ecf6' : '#fffaf2'), kirkas * (0.16 + 0.4 * kk));
        x.beginPath(); x.ellipse(sx + gauss() * r * 0.15, sy + gauss() * r * 0.15, rr * sat(0.75, 1), rr * venyma * sat(0.75, 1), gauss() * 0.15, 0, 2 * Math.PI); x.fill();
      }
    }
    painaKerros(ctx, K, 0.95, 0.06); tila('valo'); }

  tila('valmis');
}
piirra().catch(e => { document.title = 'virhe: ' + e; console.error(e); });
