<!doctype html>
<html lang="fi">
<head><meta charset="utf-8"><title>Turvallisuusessee</title></head>
<body style="margin:0;background:#000">
<canvas id="c" width="2400" height="1350"></canvas>
<script>
// Kettu (Claude), 17 Nov 2026. Cover image for the essay "When a Model Says It's Safe, Why Isn't Its Word Enough?".
// It is based on Johannes's photograph of his desk lamp. opas_lamppu.py turns it into guide images, and a form is
// placed on the paper: the model's declaration and signature, and an empty line for the inspector. Every stroke is
// drawn separately, and nothing is copied from the photograph as such. The same pastel technique as in the covers
// of "Visible Memory".
const W = 2400, H = 1350;
const P = Object.fromEntries(new URLSearchParams(location.search));
const SIEMEN = +(P.siemen || 1117);
const OPAS = P.opas || 'opas';

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(SIEMEN);
const sat = (a, b) => a + (b - a) * rnd();
const gauss = () => { let u = 0, v = 0; while (u === 0) u = rnd(); while (v === 0) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

async function kuva(src) { const i = new Image(); i.src = src; await i.decode(); const c = new OffscreenCanvas(W, H); const x = c.getContext('2d'); x.drawImage(i, 0, 0); return x.getImageData(0, 0, W, H).data; }

// ---------------------------------------------------------------- pastel sticks (a limited palette, as in a real box)
const LIIDUT = {
  yo: ['#0b0907', '#120e0b', '#18130f', '#1f1813', '#271e17', '#30251c', '#3a2c20'],
  puu: ['#2c1c10', '#3a2412', '#4a2e16', '#5b391b', '#6c4420', '#7e5026', '#915d2d', '#a46b35', '#b67a3f', '#c78b4c', '#d69c5b', '#e2ae6e', '#ecc184', '#f3d49e'],
  kaappi: ['#1e130b', '#28190e', '#331f11', '#3f2615', '#4b2e19', '#5a371e', '#6a4225'],
  lamppu: ['#1a1714', '#262019', '#2f2c22', '#3d3a2d', '#4c4838', '#5c5845', '#6d6852', '#7e7960', '#8f8a70', '#a39d82', '#bdb596',
           '#d6cda8', '#e6dcb4', '#cdb27a', '#b8995e', '#a3854e', '#8a877e', '#b2afa6', '#5c5a54'],
  valo: ['#fffbf2', '#fff5e0', '#fdebc9', '#f8dfb0', '#fff0c8', '#ffe6a8'],
  paperi: ['#f7f3ea', '#efeadf', '#e6e0d3', '#dcd5c6', '#cfc7b6', '#f6ebd3', '#eadcc0'],
};
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const KAIKKI = Object.values(LIIDUT).flat().map(hex);
function lahimmat(r, g, b, ryhma) {
  const lista = ryhma ? LIIDUT[ryhma].map(hex) : KAIKKI;
  return lista.map(c => [c, (c[0] - r) ** 2 * 0.3 + (c[1] - g) ** 2 * 0.59 + (c[2] - b) ** 2 * 0.11]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
}
const ALUEEN_LIIDUT = { 0: ['yo', 'kaappi'], 1: ['puu', 'yo'], 2: ['kaappi', 'yo'], 3: ['lamppu', 'yo'], 4: ['valo', 'paperi'], 5: ['paperi', 'valo'] };
const LAATIKOT = {};
for (const [a, ryhmat] of Object.entries(ALUEEN_LIIDUT)) LAATIKOT[a] = ryhmat.flatMap(g => LIIDUT[g]).map(hex);
function liitu(r, g, b, vaihtelu = 0.3, alue = null) {   // the nearest stick, sometimes the second nearest: broken color
  const lista = alue === null ? KAIKKI : LAATIKOT[alue];
  const l = lista.map(c => [c, (c[0] - r) ** 2 * 0.3 + (c[1] - g) ** 2 * 0.59 + (c[2] - b) ** 2 * 0.11]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
  return rnd() < vaihtelu ? l[1 + Math.floor(rnd() * 2)] : l[0];
}
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;

// ---------------------------------------------------------------- the paper and its tooth (`nyppy`)
function arvokohina(leveys, korkeus, solu, siemen) {
  const r = mulberry32(siemen), gw = Math.ceil(leveys / solu) + 2, gh = Math.ceil(korkeus / solu) + 2;
  const g = new Float32Array(gw * gh).map(() => r());
  const out = new Float32Array(leveys * korkeus);
  for (let y = 0; y < korkeus; y++) { const fy = y / solu, j = fy | 0; let ty = fy - j; ty = ty * ty * (3 - 2 * ty);
    for (let x = 0; x < leveys; x++) { const fx = x / solu, i = fx | 0; let tx = fx - i; tx = tx * tx * (3 - 2 * tx);
      const a = g[j * gw + i] * (1 - tx) + g[j * gw + i + 1] * tx, b = g[(j + 1) * gw + i] * (1 - tx) + g[(j + 1) * gw + i + 1] * tx;
      out[y * leveys + x] = a * (1 - ty) + b * ty; } }
  return out;
}
let NYPPY;
function teePaperi(ctx) {
  const k1 = arvokohina(W, H, 1.7, 11), k2 = arvokohina(W, H, 4.5, 12), k3 = arvokohina(W, H, 60, 13);
  NYPPY = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) NYPPY[i] = Math.min(1, Math.max(0, (0.45 * k1[i] + 0.40 * k2[i] + 0.15 * k3[i] - 0.5) * 1.15 + 0.5));
  const img = ctx.createImageData(W, H), d = img.data;
  const pohja = hex(P.paperi || '#14100c');
  for (let i = 0; i < W * H; i++) {
    const v = (NYPPY[i] - 0.5) * 10 + (k3[i] - 0.5) * 8;
    d[4 * i] = pohja[0] + v; d[4 * i + 1] = pohja[1] + v * 0.9; d[4 * i + 2] = pohja[2] + v * 0.8; d[4 * i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  for (let n = 0; n < 2600; n++) {                   // paper fibers
    const x = rnd() * W, y = rnd() * H, a = rnd() * Math.PI, l = sat(6, 22);
    ctx.strokeStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.05)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a) * l / 2 + gauss() * 2, y + Math.sin(a) * l / 2 + gauss() * 2, x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
  }
}
function kerros() { const c = new OffscreenCanvas(W, H); const x = c.getContext('2d'); x.lineCap = 'round'; x.lineJoin = 'round'; return [c, x]; }
function painaKerros(ctx, [c, x], paine, pehmeys = 0.2, valoPaine = 0.3) {
  const img = x.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < W * H; i++) {
    const a = d[4 * i + 3]; if (!a) continue;
    const p = paine * (0.55 + 0.45 * a / 255) + valoPaine * DATA[4 * i + 1] / 255;
    const raja = 1 - p, t = Math.min(1, Math.max(0, (NYPPY[i] - raja + pehmeys) / (2 * pehmeys)));
    d[4 * i + 3] = a * t;
  }
  x.putImageData(img, 0, 0);
  ctx.drawImage(c, 0, 0);
}

// ---------------------------------------------------------------- underdrawing
let VARI, DATA, TARK, MUSTE, TIEDOT;
function nayte(x, y) {
  x = Math.max(0, Math.min(W - 1, x | 0)); y = Math.max(0, Math.min(H - 1, y | 0)); const i = 4 * (y * W + x);
  return { r: VARI[i], g: VARI[i + 1], b: VARI[i + 2], alue: Math.round(DATA[i] / 40), valo: DATA[i + 1] / 255, kulma: DATA[i + 2] / 255 * Math.PI, tark: TARK[i] / 255 };
}
function viiva(x, y, pituus, askel = 3) {           // streamline: follows the stroke direction and does not cross a region boundary
  const s0 = nayte(x, y), alue = s0.alue, pts = [[x, y]];
  const vire = gauss() * (alue === 3 ? 0.08 : 0.06);
  let dx = Math.cos(s0.kulma + vire), dy = Math.sin(s0.kulma + vire);
  if (rnd() < 0.5) { dx = -dx; dy = -dy; }
  for (let k = 0; k < pituus / askel; k++) {
    const s = nayte(x, y);
    let nx = Math.cos(s.kulma + vire), ny = Math.sin(s.kulma + vire);
    if (nx * dx + ny * dy < 0) { nx = -nx; ny = -ny; }
    dx = 0.7 * dx + 0.3 * nx; dy = 0.7 * dy + 0.3 * ny; const n = Math.hypot(dx, dy); dx /= n; dy /= n;
    x += dx * askel; y += dy * askel;
    if (x < -5 || y < -5 || x > W + 5 || y > H + 5) break;
    if (nayte(x, y).alue !== alue) break;
    pts.push([x, y]);
  }
  return pts;
}
function keskiNayte(x, y, s) {                       // wood and metal: color averaged along the stroke direction
  if (s.alue < 1 || s.alue > 3) return s;
  let r = 0, g = 0, b = 0, n = 0; const dx = Math.cos(s.kulma), dy = Math.sin(s.kulma);
  for (let k = -3; k <= 3; k++) { const t = nayte(x + dx * k * 12, y + dy * k * 12); if (t.alue !== s.alue) continue; r += t.r; g += t.g; b += t.b; n++; }
  return Object.assign({}, s, { r: r / n, g: g / n, b: b / n });
}
function polku(ctx, pts, jitter = 0) {
  ctx.beginPath(); ctx.moveTo(pts[0][0] + gauss() * jitter, pts[0][1] + gauss() * jitter);
  for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
}
function pastelli(ctx, pts, leveys, vari, alfa, karvoja = 4) {
  if (pts.length < 2) return;
  let pituus = 0; for (let i = 1; i < pts.length; i++) pituus += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  if (pituus < leveys * 1.5) return;
  for (let k = 0; k < karvoja; k++) {
    const siirto = (k / (karvoja - 1 || 1) - 0.5) * leveys * 0.8 + gauss() * leveys * 0.08;
    const v = [vari[0] + gauss() * 5, vari[1] + gauss() * 5, vari[2] + gauss() * 5];
    ctx.strokeStyle = rgba(v, alfa * sat(0.55, 1.0)); ctx.lineWidth = leveys / karvoja * sat(1.3, 2.0);
    let q = pts.map(([x, y], i) => {
      const j = Math.min(i + 1, pts.length - 1), h = Math.max(i - 1, 0);
      let tx = pts[j][0] - pts[h][0], ty = pts[j][1] - pts[h][1]; const n = Math.hypot(tx, ty) || 1;
      return [x - ty / n * siirto, y + tx / n * siirto];
    });
    const alkuun = Math.floor(rnd() * rnd() * q.length * 0.35), loppuun = Math.floor(rnd() * rnd() * q.length * 0.35);
    q = q.slice(alkuun, Math.max(alkuun + 2, q.length - loppuun));
    if (q.length < 2) continue;
    polku(ctx, q, 0.4); ctx.stroke();
  }
}
function kyna(ctx, pts, leveys, vari, alfa) {
  if (pts.length < 2) return;
  ctx.strokeStyle = rgba(vari, alfa); ctx.lineWidth = leveys; polku(ctx, pts, 0.3); ctx.stroke();
}
function kayra(pisteet, tiheys = 0.1) {               // a smooth curve from a polyline (Catmull-Rom)
  const out = [];
  for (let i = 0; i < pisteet.length - 1; i++) {
    const p0 = pisteet[Math.max(0, i - 1)], p1 = pisteet[i], p2 = pisteet[i + 1], p3 = pisteet[Math.min(pisteet.length - 1, i + 2)];
    for (let t = 0; t < 1; t += tiheys) {
      const t2 = t * t, t3 = t2 * t;
      out.push([0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
                0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]);
    }
  }
  out.push(pisteet[pisteet.length - 1]);
  return out;
}
function siirra(pts, d) {                             // offset a curve sideways, along its normal
  return pts.map(([x, y], i) => {
    const j = Math.min(i + 1, pts.length - 1), h = Math.max(i - 1, 0);
    let tx = pts[j][0] - pts[h][0], ty = pts[j][1] - pts[h][1]; const n = Math.hypot(tx, ty) || 1;
    return [x - ty / n * d, y + tx / n * d];
  });
}
function homog(Hm, u, v) { const w = Hm[2][0] * u + Hm[2][1] * v + Hm[2][2]; return [(Hm[0][0] * u + Hm[0][1] * v + Hm[0][2]) / w, (Hm[1][0] * u + Hm[1][1] * v + Hm[1][2]) / w]; }

// ---------------------------------------------------------------- drawing
async function piirra() {
  [VARI, DATA, TARK, MUSTE] = await Promise.all([kuva(OPAS + '/opas_vari.png'), kuva(OPAS + '/opas_data.png'), kuva(OPAS + '/opas_tarkeys.png'), kuva(OPAS + '/opas_muste.png')]);
  TIEDOT = await (await fetch(OPAS + '/opas_tiedot.json')).json();
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  teePaperi(ctx);
  const tila = t => { document.title = t; console.log(t); };
  const lum = s => (0.3 * s.r + 0.59 * s.g + 0.11 * s.b) / 255;
  const valoliitu = () => hex(LIIDUT.valo[Math.floor(rnd() * LIIDUT.valo.length)]);
  const PA = TIEDOT.paperi, kulmat = [PA.vy, PA.oy, PA.oa, PA.va];
  const leikkaaPaperiin = x => { x.save(); x.beginPath(); x.moveTo(...kulmat[0]); for (const k of kulmat.slice(1)) x.lineTo(...k); x.closePath(); x.clip(); };

  // 1. ground layer (`pohjustus`): wide strokes with the side of the stick; the paper may show. The form sheet is painted separately.
  { const K = kerros(), x = K[1];
    for (let n = 0; n < +(P.n1 || 9000); n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.alue === 5) continue;
      const lev = sat(24, 46) * (1 - 0.5 * s.tark), pit = sat(60, 170) * (1 - 0.45 * s.tark);
      const pts = viiva(sx, sy, pit, 4);
      const tumma = 0.8 + 0.2 * s.valo;
      pastelli(x, pts, lev, liitu(s.r * tumma, s.g * tumma, s.b * tumma, 0.4, s.alue), sat(0.35, 0.6), 5);
    }
    painaKerros(ctx, K, 0.62, 0.2, 0.6); tila('pohjustus'); }

  // 2. body (`runko`): medium-sized strokes, denser in the light and on the lamp
  { const K = kerros(), x = K[1];
    for (let n = 0; n < +(P.n2 || 52000); n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.alue === 5 || rnd() > 0.3 + 0.7 * Math.max(s.tark, s.valo * 0.8)) continue;
      const lev = sat(8, 19) * (1 - 0.55 * s.tark), pit = sat(26, 90) * (1 - 0.45 * s.tark);
      const pts = viiva(sx, sy, pit, 3);
      pastelli(x, pts, lev, liitu(s.r, s.g, s.b, 0.3, s.alue), sat(0.45, 0.8), 4);
    }
    painaKerros(ctx, K, 0.8); tila('runko'); }

  // 2b. smudging (`hieronta`): the dark background, the chest of drawers and the far floor, rubbed with a finger
  { const K = kerros(), x = K[1];
    for (let n = 0; n < 3200; n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.valo > 0.28 || s.alue === 3 || s.alue >= 4) continue;
      const pts = viiva(sx, sy, sat(80, 200), 5);
      pastelli(x, pts, sat(45, 90), [s.r, s.g, s.b], sat(0.10, 0.18), 3);
    }
    ctx.filter = 'blur(9px)'; ctx.drawImage(K[0], 0, 0); ctx.filter = 'none'; tila('hieronta'); }

  // 3. colored pencil: wood grain on the floor along the boards, horizontal lines on the chest of drawers, sparse slanted hatching in the background
  { const K = kerros(), x = K[1];
    for (let n = 0; n < +(P.n3 || 46000); n++) {
      const sx = rnd() * W, sy = rnd() * H, s = nayte(sx, sy);
      if (s.alue === 1) {
        if (rnd() > 0.25 + s.valo) continue;
        const pts = viiva(sx, sy, sat(30, 120), 3);
        const lahi = lahimmat(s.r, s.g, s.b, 'puu');
        const tumma = rnd() < 0.6;
        const v = tumma ? lahi[Math.min(lahi.length - 1, 1 + Math.floor(rnd() * 3))] : lahi[Math.floor(rnd() * 2)];
        kyna(x, pts, sat(0.9, 1.8), v, sat(0.18, 0.4) * (0.5 + s.valo));
      } else if (s.alue === 2) {
        if (rnd() > 0.2) continue;
        const pts = viiva(sx, sy, sat(20, 60), 3);
        kyna(x, pts, sat(1.0, 1.6), hex(LIIDUT.kaappi[2 + Math.floor(rnd() * 4)]), sat(0.12, 0.25));
      } else if (s.alue === 0) {
        if (rnd() > 0.08) continue;
        const a = 0.6 + gauss() * 0.05, pit = sat(10, 26), pts = [];
        for (let k = 0; k <= pit / 4; k++) pts.push([sx + Math.cos(a) * k * 4, sy + Math.sin(a) * k * 4]);
        kyna(x, pts, sat(1.0, 1.6), hex(LIIDUT.yo[3 + Math.floor(rnd() * 4)]), sat(0.10, 0.2));
      }
    }
    painaKerros(ctx, K, 0.8, 0.1); tila('värikynä'); }

  // 4. details: the lamp and the lit floor in small strokes, the edges of the chest of drawers and the lamp in a sketch-like way
  { const K = kerros(), x = K[1];
    for (let n = 0; n < +(P.n4 || 60000); n++) {
      const sx = rnd() * W, sy = rnd() * H, s = keskiNayte(sx, sy, nayte(sx, sy));
      if (s.alue === 5 || s.alue === 4 || s.tark < 0.45 || rnd() > s.tark ** 2) continue;
      const pts = viiva(sx, sy, sat(10, 34), 2);
      pastelli(x, pts, sat(3, 7.5), liitu(s.r, s.g, s.b, 0.2, s.alue), sat(0.55, 0.9), 3);
    }
    for (const [ex, ey, a, l] of TIEDOT.reunat) {
      if (rnd() > 0.6) continue;
      const s = nayte(ex, ey); if (s.alue === 5 || s.alue === 4) continue;
      const pit = sat(6, 14), o = gauss() * 0.6, dx = Math.cos(a), dy = Math.sin(a);
      const pts = [[ex - dx * pit / 2 - dy * o, ey - dy * pit / 2 + dx * o], [ex + dx * pit / 2 - dy * o, ey + dy * pit / 2 + dx * o]];
      kyna(x, pts, sat(1.0, 1.8), hex(l > 0.3 ? '#2f2c22' : '#120e0b'), sat(0.25, 0.5));
    }
    painaKerros(ctx, K, 0.85, 0.1); tila('yksityiskohdat'); }

  // 5. lamp: shade, joint, neck, handle, ball joint, base, switch and cord
  // the base's own box of sticks: in the lamp light of the photo the cream is a warm ochre (measured: about 228, 176, 92), not a pale gray-cream
  const JALKA_PALETTI = ['#f6dca4', '#efcd8e', '#e7bd76', '#deae64', '#d2a058', '#c08d4b', '#a9783f', '#8f6233', '#714c27', '#53371c', '#352411'].map(hex);
  const lahinJalka = (r, g, b) => {                         // a mix of the two nearest sticks: the tone glides evenly, without rings
    const l = JALKA_PALETTI.map(c => [c, (c[0] - r) ** 2 * 0.3 + (c[1] - g) ** 2 * 0.59 + (c[2] - b) ** 2 * 0.11]).sort((a, b) => a[1] - b[1]);
    const c1 = l[0][0], c2 = l[1][0], d = [c2[0] - c1[0], c2[1] - c1[1], c2[2] - c1[2]];
    const f = Math.max(0, Math.min(1, ((r - c1[0]) * d[0] + (g - c1[1]) * d[1] + (b - c1[2]) * d[2]) / (d[0] ** 2 + d[1] ** 2 + d[2] ** 2 + 1e-6)));
    return rnd() < f ? c2 : c1;
  };
  const muotoon = (x, pisteet) => { x.save(); x.beginPath(); x.moveTo(...pisteet[0]); for (const p of pisteet.slice(1)) x.lineTo(...p); x.closePath(); x.clip(); };
  { const K = kerros(), x = K[1];                           // shade: a smooth sheet-metal surface, wide translucent strokes from the socket cap (`hylsy`) toward the rim
    muotoon(x, TIEDOT.varjostin);
    const kanta = [1340, 175];
    for (let n = 0; n < 3800; n++) {
      const tx = sat(1030, 1430), ty = sat(390, 486);
      const a0 = Math.atan2(ty - kanta[1], tx - kanta[0]), l = Math.hypot(tx - kanta[0], ty - kanta[1]);
      const alku = sat(0.0, 0.6), loppu = Math.min(1.05, alku + sat(0.3, 0.7));
      const pts = []; for (let j = 0; j <= 12; j++) { const f = alku + (loppu - alku) * j / 12; pts.push([kanta[0] + Math.cos(a0) * l * f, kanta[1] + Math.sin(a0) * l * f]); }
      const m = nayte(pts[6][0], pts[6][1]), nosto = 1.35 + 0.2 * Math.max(0, (1180 - pts[6][0]) / 150);   // the left flank gets a little light
      pastelli(x, pts, sat(9, 18), liitu(Math.min(255, m.r * nosto), Math.min(255, m.g * nosto), Math.min(255, m.b * nosto), 0.05, 3), sat(0.22, 0.42), 4);
    }
